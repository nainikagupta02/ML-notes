project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "notes/**/*.qmd"
    - "!templates/**"

website:
  title: "ml notes"
  description: "a growing collection of machine learning notes by nainika gupta."
  site-url: "https://nainikagupta02.github.io/ML-notes/"
  repo-url: "https://github.com/nainikagupta02/ML-notes"
  repo-actions: [edit]
  page-navigation: true
  back-to-top-navigation: true
  bread-crumbs: false
  search:
    location: sidebar
    type: textbox
  sidebar:
    style: docked
    collapse-level: 1
    contents:
