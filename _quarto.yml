format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: on this page
    toc-depth: 2
    number-sections: false
    code-copy: true
    code-overflow: wrap
    html-math-method: mathjax
    lang: en

language: _language.yml
execute:
  enabled: false
